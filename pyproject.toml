[project]
name = "fieldtwin"
version = "0.1.0"
description = "Simulate-before-acting manipulation: twin fidelity, identifiability and verification"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldtwin"]
